services:
  - type: web
    name: shivnath-backend
    runtime: python
    buildCommand: "pip install -r shivnath_backend/requirements.txt && cd shivnath_backend/shivnath_backend && python manage.py migrate && python manage.py create_admin"
    startCommand: "cd shivnath_backend/shivnath_backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shivnath-db
          property: connectionString

databases:
  - name: shivnath-db
    databaseName: shivnath_db
    user: shivnath_user
