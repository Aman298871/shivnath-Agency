name: shivnath_agency
description: "Shivnath Agency - Customer, Franchise & Admin Business Management App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  file_saver: ^0.2.14
  # iOS style icons
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  # State Management
  provider: ^6.1.5

  # Local Storage / Login Session
  shared_preferences: ^2.5.3

  # Date, Time & Currency Formatting
  intl: ^0.20.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.4

  # Firebase Cloud Messaging & Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  razorpay_flutter: ^1.4.7
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/